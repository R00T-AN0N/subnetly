<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A8AE" />
      <stop offset="40%" stop-color="#017885" />
      <stop offset="100%" stop-color="#002A38" />
    </linearGradient>

    <!-- 3D Node Gradient -->
    <radialGradient id="orangeGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFD659" />
      <stop offset="40%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#C23300" />
    </radialGradient>

    <!-- Drop Shadow for the white 'S' path -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="8" flood-color="#00151C" flood-opacity="0.55" />
    </filter>

    <!-- Squircle Clip Path for the background waves -->
    <clipPath id="squircle">
      <rect x="24" y="24" width="464" height="464" rx="140" />
    </clipPath>
  </defs>

  <!-- Base Squircle Background -->
  <g clip-path="url(#squircle)">
    <rect x="24" y="24" width="464" height="464" rx="140" fill="url(#bgGrad)" />
    
    <!-- Abstract subtle waves to match the fluid background -->
    <path d="M -50 250 C 150 100, 350 450, 550 250 L 550 550 L -50 550 Z" fill="#003543" opacity="0.6" />
    <path d="M -50 400 C 200 300, 400 500, 550 350 L 550 550 L -50 550 Z" fill="#001824" opacity="0.5" />
  </g>

  <!-- Group containing the thick white circuit path and node borders -->
  <g filter="url(#shadow)">
    <!-- Top and Middle hook of the 'S' -->
    <path d="M 376 136 
             L 236 136 
             A 60 60 0 0 0 236 256 
             L 276 256 
             A 60 60 0 0 1 276 376" 
          fill="none" stroke="#F5F7F8" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
          
    <!-- Bottom horizontal tail and left hook -->
    <path d="M 376 376 
             L 196 376 
             A 60 60 0 0 1 136 316 
             L 136 256" 
          fill="none" stroke="#F5F7F8" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
          
    <!-- White outer rings for the nodes -->
    <circle cx="376" cy="136" r="38" fill="#F5F7F8" />
    <circle cx="136" cy="256" r="38" fill="#F5F7F8" />
    <circle cx="376" cy="376" r="38" fill="#F5F7F8" />
  </g>

  <!-- Orange spherical inner nodes -->
  <circle cx="376" cy="136" r="22" fill="url(#orangeGrad)" />
  <circle cx="136" cy="256" r="22" fill="url(#orangeGrad)" />
  <circle cx="376" cy="376" r="22" fill="url(#orangeGrad)" />
</svg>
